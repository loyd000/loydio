<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arc Carousel — Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0F1410;
    --card-bg: #171E19;
    --card-bg-active: #1E2721;
    --copper: #C97C4B;
    --copper-dim: #5A4033;
    --sage: #7FA88A;
    --text: #EDEAE2;
    --text-muted: #8B9088;
    --line: #2A322C;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    overflow-x: hidden;
  }

  .heading {
    text-align: center;
    padding: 6vh 6vw 0;
  }

  .heading .eyebrow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.75rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--copper);
    margin-bottom: 0.75rem;
  }

  .heading h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 600;
    font-size: clamp(1.6rem, 4vw, 2.4rem);
  }

  /* ---------- Arc stage ---------- */
  .arc-wrap {
    position: relative;
    height: 46vh;
    min-height: 340px;
    margin-top: 4vh;
    touch-action: pan-y;
    cursor: grab;
    user-select: none;
  }

  .arc-wrap.dragging { cursor: grabbing; }

  .arc-stage {
    position: relative;
    width: 100%;
    height: 100%;
  }

  .arc-card {
    position: absolute;
    left: 0;
    top: 0;
    width: 172px;
    height: 172px;
    margin-left: -86px;
    margin-top: -86px;
    background: var(--card-bg);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 1.1rem 1.1rem;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    will-change: transform, opacity;
    pointer-events: auto;
    cursor: pointer;
    transition: background 0.25s ease, border-color 0.25s ease;
  }

  .arc-card.active {
    background: var(--card-bg-active);
    border-color: var(--copper-dim);
  }

  .arc-card .idx {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.7rem;
    color: var(--copper);
    opacity: 0.8;
  }

  .arc-card .status-dot {
    display: inline-block;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--sage);
    margin-left: 0.4rem;
    vertical-align: middle;
  }

  .arc-card .status-dot.shipped { background: var(--copper); }

  .arc-card h3 {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 600;
    font-size: 0.95rem;
    line-height: 1.25;
    margin-top: 0.5rem;
  }

  .arc-card .tag {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.68rem;
    color: var(--text-muted);
  }

  /* ---------- Controls ---------- */
  .arc-controls {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 1.5rem;
    margin-top: 2vh;
  }

  .arc-btn {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--text);
    font-size: 1rem;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: border-color 0.2s ease, color 0.2s ease;
  }

  .arc-btn:hover { border-color: var(--copper); color: var(--copper); }

  .dots {
    display: flex;
    gap: 0.5rem;
  }

  .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--line);
    cursor: pointer;
    transition: background 0.25s ease, transform 0.25s ease;
  }

  .dot.active {
    background: var(--copper);
    transform: scale(1.4);
  }

  /* ---------- Detail panel ---------- */
  .detail-panel {
    max-width: 480px;
    margin: 4vh auto 6vh;
    padding: 0 6vw;
    text-align: center;
  }

  .detail-panel .status-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.7rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--sage);
    margin-bottom: 0.75rem;
  }

  .detail-panel h2 {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 600;
    font-size: clamp(1.4rem, 3vw, 1.9rem);
    margin-bottom: 0.9rem;
    transition: opacity 0.2s ease;
  }

  .detail-panel p {
    color: var(--text-muted);
    font-size: 0.95rem;
    line-height: 1.65;
    transition: opacity 0.2s ease;
  }

  .detail-tags {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 0.5rem;
    margin-top: 1.25rem;
  }

  .detail-tags span {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.7rem;
    color: var(--text-muted);
    border: 1px solid var(--line);
    padding: 0.3rem 0.6rem;
    border-radius: 4px;
  }

  .hint {
    text-align: center;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.7rem;
    color: var(--text-muted);
    opacity: 0.6;
    margin-top: -3vh;
    padding-bottom: 2vh;
  }
</style>
</head>
<body>

<div class="heading">
  <div class="eyebrow">Projects</div>
  <h1>Drag, swipe, or scroll to browse</h1>
</div>

<div class="arc-wrap" id="arcWrap">
  <div class="arc-stage" id="arcStage"></div>
</div>

<div class="arc-controls">
  <button class="arc-btn" id="prevBtn" aria-label="Previous project">←</button>
  <div class="dots" id="dots"></div>
  <button class="arc-btn" id="nextBtn" aria-label="Next project">→</button>
</div>

<div class="hint">drag the arc · or use ← →</div>

<div class="detail-panel">
  <div class="status-label" id="detailStatus">Shipped</div>
  <h2 id="detailTitle">—</h2>
  <p id="detailDesc">—</p>
  <div class="detail-tags" id="detailTags"></div>
</div>

<script>
(function () {
  const projects = [
    {
      title: "CATOK",
      status: "Shipped",
      shipped: true,
      desc: "A young coconut maturity detector that listens instead of cutting. Acoustic signal analysis feeds a cascaded binary CNN running on an ESP32-S3.",
      tags: ["TinyML", "ESP32-S3", "CNN"]
    },
    {
      title: "AMTEC Catalogue",
      status: "Shipped",
      shipped: true,
      desc: "A WordPress plugin built during my OJT at AMTEC, UPLB, pulling live equipment data straight from Google Sheets so the catalogue updates itself.",
      tags: ["WordPress", "Sheets API", "PHP"]
    },
    {
      title: "Attendance System",
      status: "In progress",
      shipped: false,
      desc: "A web attendance app with facial recognition sign-in, mandatory daily accomplishment reports, role-based access, and auto-generated email reports.",
      tags: ["Next.js", "Supabase", "face-api.js"]
    },
    {
      title: "Dynaflow Quoting Tool",
      status: "In progress",
      shipped: false,
      desc: "Turning a sprawling Excel price book into a proper web app, with cleaned pricing data and resolved cost codes for faster quoting.",
      tags: ["Data Cleaning", "Web App"]
    },
    {
      title: "AI Photo Sorter",
      status: "Shipped",
      shipped: true,
      desc: "A desktop tool built with PySide6 that finds and groups wedding photos by face, saving hours of manual sorting for the family photography business.",
      tags: ["Python", "PySide6", "Face Recognition"]
    }
  ];

  const N = projects.length;
  const ANGLE_STEP = 21;          // degrees between adjacent cards — tight, cards nearly touch
  const HALF_TOTAL = (N * ANGLE_STEP) / 2;
  const MAX_VISIBLE_DIFF = ANGLE_STEP * 3.4;

  const wrap = document.getElementById('arcWrap');
  const stage = document.getElementById('arcStage');
  const dotsEl = document.getElementById('dots');
  const detailTitle = document.getElementById('detailTitle');
  const detailDesc = document.getElementById('detailDesc');
  const detailStatus = document.getElementById('detailStatus');
  const detailTags = document.getElementById('detailTags');

  // Build card elements
  const cardEls = projects.map((p, i) => {
    const el = document.createElement('div');
    el.className = 'arc-card';
    el.innerHTML = `
      <div class="idx">0${i + 1}<span class="status-dot ${p.shipped ? 'shipped' : ''}"></span></div>
      <h3>${p.title}</h3>
      <div class="tag">${p.tags[0]}</div>
    `;
    el.addEventListener('click', () => goTo(i));
    stage.appendChild(el);
    return el;
  });

  // Build dots
  const dotEls = projects.map((p, i) => {
    const d = document.createElement('div');
    d.className = 'dot';
    d.addEventListener('click', () => goTo(i));
    dotsEl.appendChild(d);
    return d;
  });

  let offset = 0;          // continuous degrees, drives rendering
  let targetOffset = 0;    // where we're animating toward
  let dragging = false;
  let dragStartX = 0;
  let dragStartOffset = 0;
  let animRAF = null;
  let activeIndex = 0;

  function wrapDiff(d) {
    // shortest angular distance, wrapped into [-HALF_TOTAL, HALF_TOTAL)
    let x = ((d + HALF_TOTAL) % (N * ANGLE_STEP) + (N * ANGLE_STEP)) % (N * ANGLE_STEP) - HALF_TOTAL;
    return x;
  }

  function geometry() {
    const w = wrap.clientWidth;
    const h = wrap.clientHeight;
    const radius = Math.max(560, Math.min(w * 1.05, 980));
    const centerX = w / 2;
    const centerY = h + radius * 0.5;
    return { w, h, radius, centerX, centerY };
  }

  function render() {
    const { radius, centerX, centerY } = geometry();

    projects.forEach((p, i) => {
      const diff = wrapDiff(i * ANGLE_STEP - offset);
      const el = cardEls[i];

      if (Math.abs(diff) > MAX_VISIBLE_DIFF) {
        el.style.opacity = '0';
        el.style.pointerEvents = 'none';
        return;
      }

      const angleDeg = 270 + diff;
      const angleRad = (angleDeg * Math.PI) / 180;
      const x = centerX + radius * Math.cos(angleRad);
      const y = centerY + radius * Math.sin(angleRad);

      const closeness = 1 - Math.min(Math.abs(diff) / MAX_VISIBLE_DIFF, 1);
      const scale = 0.86 + closeness * 0.2;
      const opacity = 0.45 + closeness * 0.55;
      const rot = diff * 0.32;

      el.style.transform = `translate(${x}px, ${y}px) rotate(${rot}deg) scale(${scale})`;
      el.style.opacity = String(opacity);
      el.style.zIndex = String(Math.round(closeness * 100));
      el.style.pointerEvents = 'auto';
      el.classList.toggle('active', Math.abs(diff) < ANGLE_STEP * 0.4);
    });

    // determine active index from offset
    const nearest = Math.round(offset / ANGLE_STEP);
    const idx = ((nearest % N) + N) % N;
    if (idx !== activeIndex) {
      activeIndex = idx;
      updateDetail(idx);
    }
    dotEls.forEach((d, i) => d.classList.toggle('active', i === activeIndex));
  }

  function updateDetail(i) {
    const p = projects[i];
    detailTitle.style.opacity = 0;
    detailDesc.style.opacity = 0;
    setTimeout(() => {
      detailStatus.textContent = p.status;
      detailTitle.textContent = p.title;
      detailDesc.textContent = p.desc;
      detailTags.innerHTML = p.tags.map(t => `<span>${t}</span>`).join('');
      detailTitle.style.opacity = 1;
      detailDesc.style.opacity = 1;
    }, 120);
  }

  function animateTo(target, duration = 420) {
    cancelAnimationFrame(animRAF);
    const start = offset;
    const delta = target - start;
    const startTime = performance.now();

    function step(now) {
      const t = Math.min((now - startTime) / duration, 1);
      const eased = 1 - Math.pow(1 - t, 3); // ease-out cubic
      offset = start + delta * eased;
      render();
      if (t < 1) animRAF = requestAnimationFrame(step);
    }
    animRAF = requestAnimationFrame(step);
  }

  function goTo(i) {
    // choose the nearest raw offset target that lands on index i
    const nearestRaw = Math.round(offset / ANGLE_STEP);
    const nearestIdx = ((nearestRaw % N) + N) % N;
    let deltaIdx = i - nearestIdx;
    if (deltaIdx > N / 2) deltaIdx -= N;
    if (deltaIdx < -N / 2) deltaIdx += N;
    const target = (nearestRaw + deltaIdx) * ANGLE_STEP;
    animateTo(target);
  }

  function snap() {
    const nearestRaw = Math.round(offset / ANGLE_STEP);
    animateTo(nearestRaw * ANGLE_STEP, 380);
  }

  // ---------- Pointer (mouse + touch) drag ----------
  wrap.addEventListener('pointerdown', (e) => {
    dragging = true;
    wrap.classList.add('dragging');
    dragStartX = e.clientX;
    dragStartOffset = offset;
    cancelAnimationFrame(animRAF);
    wrap.setPointerCapture(e.pointerId);
  });

  wrap.addEventListener('pointermove', (e) => {
    if (!dragging) return;
    const dx = e.clientX - dragStartX;
    const DEG_PER_PX = 0.28;
    offset = dragStartOffset - dx * DEG_PER_PX;
    render();
  });

  function endDrag() {
    if (!dragging) return;
    dragging = false;
    wrap.classList.remove('dragging');
    snap();
  }

  wrap.addEventListener('pointerup', endDrag);
  wrap.addEventListener('pointercancel', endDrag);
  wrap.addEventListener('pointerleave', () => { if (dragging) endDrag(); });

  // ---------- Wheel (desktop scroll) ----------
  let wheelTimeout = null;
  wrap.addEventListener('wheel', (e) => {
    e.preventDefault();
    const delta = (Math.abs(e.deltaX) > Math.abs(e.deltaY)) ? e.deltaX : e.deltaY;
    offset += delta * 0.14;
    render();
    clearTimeout(wheelTimeout);
    wheelTimeout = setTimeout(snap, 140);
  }, { passive: false });

  // ---------- Buttons + keyboard ----------
  document.getElementById('prevBtn').addEventListener('click', () => goTo(((activeIndex - 1) % N + N) % N));
  document.getElementById('nextBtn').addEventListener('click', () => goTo((activeIndex + 1) % N));

  document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowLeft') goTo(((activeIndex - 1) % N + N) % N);
    if (e.key === 'ArrowRight') goTo((activeIndex + 1) % N);
  });

  window.addEventListener('resize', render);

  // init
  render();
  updateDetail(0);
})();
</script>
</body>
</html>
