<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <style>
    .brand {
      stroke: #000;
      fill: #000;
    }
    .box {
      fill: none;
      stroke-width: 48;
    }
    @media (prefers-color-scheme: dark) {
      .brand {
        stroke: #fff;
        fill: #fff;
      }
      .box {
        fill: none;
      }
    }
  </style>
  <rect class="brand box" x="86" y="86" width="340" height="340" transform="rotate(12, 256, 256)" />
  <text class="brand" x="256" y="256" font-family="'IBM Plex Mono', monospace, sans-serif" font-weight="bold" font-size="280" text-anchor="middle" dominant-baseline="central" dy="16" stroke="none">L</text>
</svg>
